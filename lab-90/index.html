<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>محاكاة القيادة: أول ٩٠ يوماً</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A2F; --ink2:#173F47; --paper:#EDF2F1; --card:#FFFFFF; --line:#D3DEDC;
  --text:#13262A; --muted:#5A7175;
  --col:#1F7A60; --cre:#7446C4; --cmp:#9A5B00; --ctl:#3772C4; --neg:#B03434;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--paper);color:var(--text);line-height:1.85;font-size:17px;padding-bottom:84px}
h1,h2,h3,.kufi{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif;line-height:1.6}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #0B6BCB;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* HUD */
.hud{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 14px 12px;box-shadow:0 4px 18px rgba(14,42,47,.25)}
.hud-in{max-width:820px;margin:0 auto}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.org{font-size:13px;opacity:.75}
.when{font-family:"Noto Kufi Arabic";font-weight:700;font-size:16px}
.hours{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}.hud-top>div:first-child{min-width:0;flex:1}.org{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hours b{font-size:18px}
.clock{width:26px;height:26px}
.ind{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.ind div{position:relative}
.ind small{display:flex;align-items:center;gap:5px;font-size:12.5px;opacity:.85}
nav.tabs button.on::after{background:#F0B04A!important}.timer span{background:#D98A1F!important}.timer.late span{background:var(--neg)!important}.ind small i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ind .bar{height:6px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;margin-top:3px}
.ind .bar span{display:block;height:100%;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.ind .v{position:absolute;left:0;top:0;font-size:12.5px;font-weight:600}
.dl{position:absolute;left:0;top:-14px;font-size:13px;font-weight:700;animation:fl 2s ease forwards}
@keyframes fl{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

main{max-width:820px;margin:0 auto;padding:18px 14px}
.view[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
.card.dark{background:var(--ink);color:#fff;border:0}
h1{font-size:30px;margin:0 0 6px;font-weight:800}
h2{font-size:22px;margin:0 0 8px;font-weight:700;color:var(--ink)}
.dark h2,.dark h1{color:#fff}
h3{font-size:17px;margin:0 0 6px;font-weight:700;color:var(--ink)}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:13px 24px;font-weight:600}
.btn.alt{background:#F0B04A;color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* intro */
.cover{position:relative;overflow:hidden;padding:28px 24px}.cover>*:not(.q4){position:relative;z-index:1}
.cover .q4{pointer-events:none;position:absolute;inset:auto -40px -40px auto;width:220px;height:220px;opacity:.16}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.who{display:flex;gap:10px;align-items:center}
.who .n{font-weight:700;line-height:1.4}
.who .r{font-size:13.5px;color:var(--muted);line-height:1.5}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.quad{border-radius:12px;padding:10px 12px;color:#fff}
.quad b{font-family:"Noto Kufi Arabic";display:block}
.quad span{font-size:14px;opacity:.92}

/* scene */
.scene-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.place{font-size:14px;color:var(--muted)}
.say{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.say .bub{background:#F4F7F6;border-radius:4px 16px 16px 16px;padding:10px 14px;flex:1}
.say .bub b{display:block;font-size:14px;color:var(--ink2)}
.know{background:#FFF6E6;border-right:4px solid var(--cmp);border-radius:10px;padding:8px 12px;font-size:15px;margin:10px 0}
.know b{color:#8A5A10}
.opts{margin-top:14px}
.opt{display:block;width:100%;text-align:right;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;transition:border-color .2s,background .2s;color:var(--text)}
.opt:hover:not([disabled]){border-color:var(--ink2);background:#F8FBFA}
.opt.on{border-color:var(--ink);background:#EEF5F3}
.opt.off{opacity:.42}
.result{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shifts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.shift{display:flex;align-items:center;gap:6px;background:#F2F5F4;border-radius:20px;padding:3px 12px 3px 6px;font-size:14.5px}
.shift .up{color:var(--col);font-weight:700}.shift .dn{color:var(--neg);font-weight:700}
.trade{font-size:15px;margin:8px 0}
.trade span{font-weight:700}
details.theory{background:#F1EEFA;border-radius:12px;padding:10px 14px;margin-top:10px}
details.theory summary{cursor:pointer;font-weight:600;color:#5B3BA8}
details.theory p{margin:8px 0 0;font-size:15.5px}

/* planner */
.slot{margin:14px 0}
.slot .top{display:flex;justify-content:space-between;align-items:center}
.slot .top b{font-size:16px}
.slot .hint{font-size:13.5px;color:var(--muted)}
.slot input[type=range]{width:100%;accent-color:var(--ink)}
.left{font-family:"Noto Kufi Arabic";font-weight:700;font-size:18px}
.left.bad{color:var(--neg)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0;max-height:52vh;overflow:auto;padding:4px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;animation:in .3s ease}
.msg.k{align-self:flex-start;background:#F3F1EC;border-radius:16px 16px 16px 4px}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px}
.msg.typing{opacity:.6}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;min-height:52px;direction:rtl}
.mood{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 12px;font-size:14px;font-weight:600}
.goal{background:#EAF4F1;border-radius:12px;padding:10px 14px;font-size:15px}

/* inbox / team */
.mail{border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.mail:last-child{border-bottom:0}
.mail .h{display:flex;justify-content:space-between;gap:8px}
.mail .s{font-weight:700}
.mail.unread .s::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cmp);margin-left:8px;vertical-align:middle}
.mail .b{margin-top:6px;font-size:15.5px}
.mail .from{font-size:13.5px;color:var(--muted)}
.member{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.member .info{flex:1}
.rel{height:7px;background:#E5ECEA;border-radius:4px;overflow:hidden;margin-top:4px}
.rel span{display:block;height:100%;transition:width 1s}
.stance{font-size:13px;color:var(--muted)}

/* report */
.compass-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center}
.score{font-family:"Noto Kufi Arabic";font-size:44px;font-weight:800;color:var(--ink);line-height:1.2}
.trail{list-style-type:arabic-indic}.trail li{margin-bottom:6px}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;font-weight:600;color:#fff;margin-left:4px}
.flag{background:#FDECEC;color:var(--neg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.sample{background:#FFF6E6;color:#8A5A10;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.dist .r{display:grid;grid-template-columns:1.6fr 2fr 32px;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.dist .bar{height:12px;background:#E5ECEA;border-radius:4px;overflow:hidden}
.dist .bar span{display:block;height:100%}

/* interruptions */
#toasts{position:fixed;top:150px;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;width:100%;max-width:520px;background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(14,42,47,.28);padding:12px 14px;border-top:4px solid var(--col);animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
.toast.call{border-top-color:var(--neg)}.toast.mail{border-top-color:var(--ctl)}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.toast .h{display:flex;align-items:center;gap:10px}
.toast .ch{font-size:12.5px;color:var(--muted)}
.toast .tx{margin:8px 0 10px;font-size:15.5px}
.toast .acts{display:flex;gap:8px;flex-wrap:wrap}
.toast .acts button{border:0;border-radius:10px;padding:8px 14px;font-weight:600;background:var(--ink);color:#fff;font-size:14.5px}
.toast .acts button.later{background:#E8EEED;color:var(--ink)}
.ring{animation:ring .9s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}
.missed{background:#FFF1E6;border-right:4px solid var(--cmp);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.missed b{display:block;color:#8A5A10}
.timer{height:5px;background:#E5ECEA;border-radius:4px;overflow:hidden;margin:4px 0 12px}
.timer span{display:block;height:100%;background:var(--cmp);transition:width 1s linear}
.timer.late span{background:var(--neg)}
.gate{max-width:420px;margin:12vh auto 0;text-align:center}
.gate input{font:inherit;font-size:20px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%;margin:14px 0;letter-spacing:2px}
/* nav */
nav.tabs[hidden]{display:none!important}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30}
nav.tabs .in{display:flex;max-width:820px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-size:14px;font-weight:600;position:relative}
nav.tabs button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--cmp);border-radius:0 0 3px 3px}
.badge{position:absolute;top:6px;left:calc(50% - 20px);background:var(--neg);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}

@media (max-width:640px){
  body{font-size:16px}
  h1{font-size:25px}
  .cast{grid-template-columns:1fr 1fr}
  .compass-wrap{grid-template-columns:1fr}
  .card{padding:18px}
  .ind small{font-size:11.5px}
}
</style>
</head>
<body>
<header class="hud" id="hud" hidden>
  <div class="hud-in">
    <div class="hud-top">
      <div><div class="org">هيئة الواحة للخدمات · إدارة التراخيص</div><div class="when" id="when"></div><div class="org" id="clock"></div><div id="cd" hidden style="display:none;margin-top:2px;background:#F0B04A;color:#0E2A2F;border-radius:8px;padding:1px 10px;font-weight:700;font-size:13.5px;gap:10px;align-items:center"><span id="cdt"></span><span id="cdn" dir="ltr"></span></div></div>
      <button id="mute" aria-label="كتم الصوت" style="background:none;border:0;color:#fff;padding:4px;opacity:.8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="mwave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      <div class="hours"><svg class="clock" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b id="hrs"></b> <span id="hrsl">ساعة</span></div></div>
    </div>
        <div class="ind" id="ind"></div>
  </div>
</header>

<div id="toasts" aria-live="polite"></div>
<main>
  <section class="view" id="v-scene"></section>
  <section class="view" id="v-inbox" hidden></section>
  <section class="view" id="v-team" hidden></section>
  <section class="view" id="v-compass" hidden></section>
  <section class="view" id="v-trainer" hidden></section>
</main>

<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-t="scene" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>المشهد</button>
  <button data-t="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>البريد<span class="badge" id="badge" hidden></span></button>
  <button data-t="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5.5"/></svg>الفريق</button>
  <button data-t="compass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18"/><path d="m12 6 5 6-5 6-5-6z"/></svg>البوصلة</button>
  <button data-t="trainer" id="trtab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>المدرّب</button>
</div></nav>

<script>
/* ---------- helpers ---------- */
const AR=s=>String(s).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]).replace(/%/g,"٪");
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const $=id=>document.getElementById(id);
const Q={
  col:{n:"التعاون",out:"تماسك الفريق",s:"الفريق",c:"var(--col)",hex:"#1F7A60",roles:"المرشد والميسّر",d:"الاهتمام بالناس، والثقة، وتطوير الفريق",neg:"التساهل: يصبح الانسجام أهم من الأداء، وتُؤجَّل القرارات الصعبة حتى لا يغضب أحد."},
  cre:{n:"الابتكار",out:"تقدّم التحول",s:"التحول",c:"var(--cre)",hex:"#7446C4",roles:"المبتكر والوسيط",d:"التغيير، والتجربة، وكسب الدعم والموارد",neg:"التشتت: مبادرات كثيرة تبدأ ولا تكتمل، ويفقد الفريق الإحساس بالاتجاه."},
  cmp:{n:"التنافس",out:"إنجاز المعاملات",s:"الإنجاز",c:"var(--cmp)",hex:"#9A5B00",roles:"المنتِج والموجّه",d:"النتائج، والسرعة، والأهداف الواضحة",neg:"الإنهاك: ضغط متواصل على الأرقام يستنزف الناس ويطفئ المبادرة."},
  ctl:{n:"الضبط",out:"جودة الامتثال",s:"الامتثال",c:"var(--ctl)",hex:"#3772C4",roles:"المنسّق والمراقب",d:"الإجراءات، والجودة، والاستقرار",neg:"الجمود: القواعد تصبح هدفاً بذاتها، ويتباطأ كل شيء خوفاً من الخطأ."}
};
const QK=["col","cre","cmp","ctl"];const HB={col:"#3CC29C",cre:"#A583EE",cmp:"#F0B04A",ctl:"#6FA3EA"};
const ROLE={mentor:["المرشد","col"],facilitator:["الميسّر","col"],innovator:["المبتكر","cre"],broker:["الوسيط","cre"],producer:["المنتِج","cmp"],director:["الموجّه","cmp"],coordinator:["المنسّق","ctl"],monitor:["المراقب","ctl"]};

/* ---------- cast ---------- */
const C={
  sultan:{n:"سلطان",r:"المدير التنفيذي، رئيسك المباشر",p:{g:"m",skin:"#C99A78",beard:"#8E8E8E",bg:"#D9E4F2"},rel:55},
  khalid:{n:"خالد",r:"رئيس قسم التفتيش الميداني، ١٨ عاماً في الهيئة",p:{g:"m",skin:"#B9835F",beard:"#2B211C",bg:"#F3E3C7"},rel:35},
  reem:{n:"ريم",r:"رئيسة قسم الخدمات الرقمية",p:{g:"f",skin:"#D8A987",bg:"#E7DDF6"},rel:55},
  faisal:{n:"فيصل",r:"كبير موظفي خدمة المتعاملين",p:{g:"m",skin:"#C48D69",bg:"#D6EEE6"},rel:50},
  maha:{n:"مها",r:"منسقة مكتب الإدارة",p:{g:"f",skin:"#C9966F",bg:"#F6E0D6",wrap:"#3B3346"},rel:55},
  noura:{n:"نورة",r:"مديرة الخدمات المساندة (الميزانية والمشتريات)",p:{g:"f",skin:"#E0B593",bg:"#DCEAF0",wrap:"#2E3A40"},rel:50}
};
function portrait(k,size=56,lvl){const p=C[k].p,v=lvl!=null?lvl:(S&&S.rel?S.rel[k]:50),md=v>=62?"p":v<35?"t":"n",id="c"+k+size+Math.random().toString(36).slice(2,6);
const br=y=>md==="t"?[`M40.5 ${y-6.4} L47 ${y-3.9}`,`M53 ${y-3.9} L59.5 ${y-6.4}`]:md==="p"?[`M40.5 ${y-5.6} Q44 ${y-8.2} 47 ${y-5.9}`,`M53 ${y-5.9} Q56 ${y-8.2} 59.5 ${y-5.6}`]:[`M40.5 ${y-4.5} Q44 ${y-6.2} 47 ${y-4.8}`,`M53 ${y-4.8} Q56 ${y-6.2} 59.5 ${y-4.5}`];
const eyes=y=>`<ellipse cx="44" cy="${y}" rx="1.8" ry="${md==="p"?1.5:2}" fill="#2a1d17"/><ellipse cx="56" cy="${y}" rx="1.8" ry="${md==="p"?1.5:2}" fill="#2a1d17"/>${br(y).map(d=>`<path d="${d}" stroke="#3a2a22" stroke-width="1.5" fill="none" stroke-linecap="round"/>`).join("")}`;
const mouth=(y,c)=>`<path d="${md==="p"?`M45 ${y-.6} Q50 ${y+3.8} 55 ${y-.6}`:md==="t"?`M46 ${y+.8} Q50 ${y-.9} 54 ${y+.8}`:`M46 ${y} Q50 ${y+1.5} 54 ${y}`}" stroke="${c}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;

/* ---------- state ---------- */
let S;
function newState(){
  S={step:0,week:1,day:1,hours:40,carry:0,
    ind:{col:50,cre:45,cmp:50,ctl:45},start:null,
    prof:{col:0,cre:0,cmp:0,ctl:0},
    rel:Object.fromEntries(Object.keys(C).map(k=>[k,C[k].rel])),
    flags:{},read:new Set(),log:[],chat:null,alloc:[],pending:[],missed:[],live:new Set(),time:480,t0:Date.now(),pred:null,saved:false,snz:[],remind:new Set(),open:new Set(),know:Object.fromEntries(Object.keys(C).map(k=>[k,0]))};
  S.start={...S.ind};
}

/* ---------- HUD ---------- */
function hud(d){
  $("hud").hidden=false;$("tabs").hidden=false;
  $("when").textContent=AR(`اليوم ${S.day} من ٩٠، الأسبوع ${S.week}`);
  $("hrs").textContent=AR(S.hours);drawClock();
  $("ind").innerHTML=QK.map(k=>`<div><small><i style="background:${HB[k]}"></i>${Q[k].s}</small><span class="v">${AR(S.ind[k])}</span>
   <div class="bar"><span style="width:${S.ind[k]}%;background:${HB[k]}"></span></div>
   ${d&&d[k]?`<span class="dl" style="color:${d[k]>0?"#7FE0C4":"#FF9C9C"}" dir="ltr">${d[k]>0?"+":"−"}${AR(Math.abs(d[k]))}</span>`:""}</div>`).join("");
  const un=MAIL.filter(m=>m.w<=S.week&&(!m.live||S.live.has(m.id))&&!S.read.has(m.id)).length;
  $("badge").hidden=!un;$("badge").textContent=AR(un);
}
function apply(o){
  const d={};
  if(o.ind)for(const k in o.ind){const nv=clamp(S.ind[k]+o.ind[k]);d[k]=nv-S.ind[k];S.ind[k]=nv;}
  if(o.prof)for(const k in o.prof)S.prof[k]+=o.prof[k];
  const rd={};
  if(o.rel)for(const k in o.rel){const nv=clamp(S.rel[k]+o.rel[k]);rd[k]=nv-S.rel[k];S.rel[k]=nv;}
  if(o.flags)Object.assign(S.flags,o.flags);
  return {d,rd};
}

/* ---------- tabs ---------- */
function tab(t){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ["scene","inbox","team","compass","trainer"].forEach(v=>$("v-"+v).hidden=v!==t);
  if(t==="scene"&&CUR&&!CUR.done)CUR.paint();
  if(t==="inbox")renderInbox();if(t==="team")renderTeam();if(t==="compass")renderCompass();if(t==="trainer")renderTrainer();
  window.scrollTo({top:0});
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));

  <text x="16" y="${c-6}" text-anchor="start" font-size="11" fill="#5A7175">داخلي</text>
  ${ghost?`<polygon points="${poly(ghost)}" fill="#9FB3B0" opacity=".25" stroke="#7D928F" stroke-dasharray="3 3"/>`:""}
  <polygon points="${poly(sh)}" fill="#0E2A2F" fill-opacity=".22" stroke="#0E2A2F" stroke-width="2.2" stroke-linejoin="round"/>
  ${QK.map(k=>{const [x,y]=pt(k,sh[k]);return `<circle cx="${x}" cy="${y}" r="5" fill="${Q[k].hex}" stroke="#fff" stroke-width="2"/>`}).join("")}
  <text x="40" y="44" font-size="15" font-weight="700" fill="#1F7A60" font-family="Noto Kufi Arabic">التعاون</text>

  </svg>`;
}

/* weekly planner */
const SLOT={col:["وقت مع الفريق","٨ ساعات تمنحك لقاءً فردياً واحداً، و١٤ ساعة لقاءين، و٢٠ ساعة ثلاثة لقاءات"],cre:["مشروع التحول","تصميم الخدمة، والتجارب، والتنسيق مع ريم"],cmp:["متابعة الإنجاز","الأرقام اليومية، والمعاملات المتأخرة، والمتعاملون"],ctl:["الإجراءات والجودة","التدقيق، والسياسات، وملفات التفتيش"]};
const SLOTN={col:"الفريق",cre:"مشروع التحول",cmp:"متابعة الإنجاز",ctl:"الإجراءات والجودة"};
function hrs(n,c){n=Math.abs(n);const t=n===1?"ساعة واحدة":n===2?(c?"ساعتين":"ساعتان"):n<=10?AR(n+" ساعات"):AR(n+" ساعة");return c?(n<=2?"ب":"بـ")+t:t;}
function plan(w){
  S.week=w;S.day=[1,1,8,15][w];S.hours=40+S.carry;S.carry=0;hud();
  const a={col:10,cre:10,cmp:10,ctl:10};const tot=()=>QK.reduce((s,k)=>s+a[k],0);
  if(S.hours<40){a.col=a.cre=a.cmp=a.ctl=Math.floor(S.hours/8)*2;}
  const draw=()=>{
    const left=S.hours-tot();
    $("v-scene").innerHTML=`<div class="card">
    <div class="scene-head"><h2>خطّط أسبوعك ${["","الأول","الثاني","الثالث"][w]}</h2><span class="place">لديك ${hrs(S.hours)}</span></div>
    <p class="muted">${w===1?"وقتك هو أصدق دليل على أولوياتك. ما تمنحه أقل من ١٠ ساعات يتراجع، وأقل من ٦ ساعات يتراجع بشدة، وما تمنحه أكثر يتحسن.":w===2?"الأسبوع الثاني. لاحظ كيف تغيّرت مؤشراتك بعد الأسبوع الأول قبل أن توزّع وقتك.":"الأسبوع الثالث. الضغط يتصاعد من أكثر من جهة."}</p>
    ${S.hours<40?`<div class="flag">${"أسبوعك أقصر "+hrs(40-S.hours,1)+" بسبب التزام سابق."}</div>`:""}
    ${QK.map(k=>`<div class="slot"><div class="top"><b style="color:${Q[k].c}">${SLOT[k][0]}</b><span class="kufi" id="h-${k}">${AR(a[k])} س</span></div><div class="hint">${SLOT[k][1]}</div>
    <input type="range" min="0" max="24" step="2" value="${a[k]}" data-k="${k}" aria-label="${SLOT[k][0]}"></div>`).join("")}
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="left ${left?"bad":""}" id="left">${left===0?"وُزّعت كل الساعات":left>0?"متبقٍ "+hrs(left):"تجاوزتَ "+hrs(left,1)}</span>
    <button class="btn" id="ok" ${left?"disabled":""}>اعتمد الخطة</button></div></div>`;
    document.querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{a[r.dataset.k]=+r.value;const l=S.hours-tot();$("h-"+r.dataset.k).textContent=AR(a[r.dataset.k])+" س";
      const L=$("left");L.className="left "+(l?"bad":"");L.textContent=l===0?"وُزّعت كل الساعات":l>0?"متبقٍ "+hrs(l):"تجاوزتَ "+hrs(l,1);$("ok").disabled=!!l;});
    $("ok").onclick=()=>{
      const ind={},prof={};const notes=[];
      QK.forEach(k=>{ind[k]=Math.round((a[k]-10)/2)+(a[k]<6?-3:0);prof[k]=a[k]/20;if(a[k]<6)notes.push(k);});
      if(a.col<6)ind.col-=1;
      const {d}=apply({ind,prof});S.alloc.push({...a});
      S.log.push({t:AR("خطة الأسبوع "+w),tags:QK.filter(k=>a[k]>=14)});
      hud(d);
      $("v-scene").innerHTML=`<div class="card"><h2>الأسبوع ${["","الأول","الثاني","الثالث"][w]} يمضي</h2>
      <p>${QK.filter(k=>a[k]>=14).length?"أكثر ما أخذ من وقتك هذا الأسبوع: "+QK.filter(k=>a[k]>=14).map(k=>"<b>"+SLOTN[k]+"</b>").join(" و")+". وظهر ذلك في المؤشرات.":notes.length?"":"وزّعتَ وقتك بالتساوي تقريباً. لا شيء تراجع بشدة، ولا شيء تقدّم بوضوح."}</p>
      ${notes.length?`<div class="flag">ما أهملته هذا الأسبوع: ${notes.map(k=>SLOTN[k]).join(" و")}. ${notes.includes("col")?"لاحظت مها أن بابك بقي مغلقاً معظم الأسبوع.":"تراكمت الملفات في هذا الجانب."}</div>`:""}
      <div class="say" style="margin:10px 0"><div class="bub" style="border-radius:16px"><b>ما يُقال في الممرات</b>${pulse()}</div></div>
      <p class="muted">${w===1?"وصلتك رسائل جديدة في البريد.":"تحقق من بريدك قبل القرار القادم."}</p>

/* decision engine */
function meetings(n){
  const met=new Set(),said=[];
  const away=k=>k==="faisal"&&S.flags.faisalLeave;
  const draw=(last)=>{
    const left=n-met.size;
    $("meet").innerHTML=`<div style="border-top:1px dashed var(--line);margin:14px 0;padding-top:14px"><h3>لقاءات فردية</h3>
     ${n===0?`<p class="muted">لم تخصص للفريق وقتاً يكفي للقاء فردي هذا الأسبوع. تحتاج ٨ ساعات على الأقل.</p>`
       :`<p class="muted">${left>0?(left===1?"لديك وقت للقاء واحد":left===2?"لديك وقت للقاءين":"لديك وقت لثلاثة لقاءات")+". اختر من تجلس معه. ما تعرفه عن الناس يظهر لك في قراراتك القادمة، وقد يفتح لك خيارات لا يراها غيرك.":"انتهى وقت اللقاءات لهذا الأسبوع."}</p>
       <div class="cast">${Object.keys(C).map(k=>`<button class="who mt" data-k="${k}" ${left<=0||met.has(k)||S.know[k]>=3||away(k)?"disabled":""} style="background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:right;${left<=0||met.has(k)||S.know[k]>=3||away(k)?"opacity:.45":""}">${portrait(k,40)}<div><div class="n">${C[k].n}</div><div class="r">${away(k)?"في إجازة":S.know[k]?AR("لقاء "+S.know[k]+" من 3"):"لم تلتقيا بعد"}</div></div></button>`).join("")}</div>`}
     <div id="said">${said.map(([k,t])=>`<div class="say" style="margin-top:12px">${portrait(k,48)}<div class="bub"><b>لقاؤك مع ${C[k].n}</b>${t}</div></div>`).join("")}</div></div>`;
    document.querySelectorAll(".mt").forEach(b=>b.onclick=()=>{const k=b.dataset.k;met.add(k);
      if(S.rel[k]<30){apply({rel:{[k]:2}});said.push([k,"جلس معك عشر دقائق وأجاب عن أسئلتك باقتضاب، ولم يقل شيئاً عن نفسه. الثقة بينكما لا تكفي بعد لحديث كهذا."]);}
      else{S.know[k]++;apply({rel:{[k]:3}});said.push([k,BIO[k][S.know[k]-1][0]]);}
      S.log.push({t:"لقاء فردي: "+C[k].n,tags:["col"]});hud();draw(k);
      const el=$("said").lastElementChild;if(el)el.scrollIntoView({behavior:"smooth",block:"center"});});
  };
  draw(null);
}
function know(ids,who){const k=ids.filter(i=>S.read.has(i)).map(i=>MAIL.find(m=>m.id===i).k).filter(Boolean);
  const p=(who||[]).filter(w=>S.know[w]>0).map(w=>`<div style="margin-top:4px"><b>ما تعرفه عن ${C[w].n}:</b> ${BIO[w][S.know[w]-1][1]}</div>`).join("");
  return k.length||p?`<div class="know">${k.length?`<b>ما تعرفه من بريدك:</b> ${k.join(" ")}`:""}${p}</div>`:"";}
function decision(cfg){
  S.day=cfg.day;hud();let opts=cfg.opts.filter(o=>!o.need||o.need());
  const optsHTML=()=>opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.tag?`<span class="tag" style="background:var(--col);display:inline-block;margin-bottom:4px">${o.tag}</span><br>`:""}${o.t}</button>`).join("");
  $("v-scene").innerHTML=`<div class="card">
   <div class="scene-head"><span class="place">${AR("اليوم "+cfg.day)}، ${cfg.place}</span></div>

async function sendAI(){
  const ch=S.chat,ta=$("ta"),txt=(ta.value||"").trim();if(!txt||ch.busy)return;
  ch.busy=true;ch.hist.push({r:"u",t:txt});ch.turns++;
  drawChat();$("chat").insertAdjacentHTML("beforeend",`<div class="msg k typing" id="typ">خالد يكتب...</div>`);
  const transcript=ch.hist.map(m=>(m.r==="k"?"KHALID: ":"DIRECTOR: ")+m.t).join("\n");
  const prompt=`${KHALID_BRIEF}
${ROLE_DEF}
Khalid's current trust in the director, 0-100: ${ch.trust}.
Conversation so far:
${transcript}

Task: (1) Judge the director's LAST message only: which of the eight roles it shows (0-2 roles), and how it changes Khalid's trust (integer from -12 to +12; generic or flattering lines get 0 or negative). (2) Write Khalid's next reply in character given the new trust level.${ch.turns>=ch.max?" This is the director's last message: Khalid should close the meeting naturally in his reply.":""}
Return JSON only: {"trust_delta": int, "roles": ["..."], "reply": "Arabic text"}`;
  try{
    const r=await SAMPLE.json(prompt,{modelTier:"default"});
    const dlt=Math.max(-12,Math.min(12,parseInt(r.trust_delta)||0));
    ch.trust=clamp(ch.trust+dlt);(r.roles||[]).forEach(x=>ROLE[x]&&ch.roles.push(x));
    ch.hist.push({r:"k",t:String(r.reply||"...")});
  }catch(e){
    ch.ai=false;ch.hist.pop();ch.turns=Math.max(0,Math.min(ch.turns-1,SCRIPT.length-1));
  }
  ch.busy=false;if(ch.ai&&ch.turns>=ch.max)ch.done=true;drawChat();
}

let TIMERS=[],EVT=[],TICK=null,WAIT=null,UNFIRED=[],CUR=null;
function drawClock(){const m=S.time,h=Math.floor(m/60),mm=m%60;const h12=((h+11)%12)+1;
  $("clock").textContent=AR(`${DAYS[(S.day-1)%7]}، ${h12}:${String(mm).padStart(2,"0")} ${h<12?"ص":"م"}`);}
function clearTimers(){TIMERS.concat(EVT).forEach(clearTimeout);TIMERS=[];EVT=[];stopWait();$("toasts").innerHTML="";Q_T.length=0;}
function schedule(){
  S.time=START_TIME[S.step]||540;
  if(!TICK)TICK=setInterval(()=>{if(!S||$("hud").hidden)return;S.time=Math.min(S.time+1,1080);drawClock();},1000);
  UNFIRED=EVENTS.filter(e=>e.step===S.step&&(!e.when||e.when()));
  UNFIRED.forEach(e=>EVT.push(setTimeout(()=>{UNFIRED=UNFIRED.filter(x=>x!==e);fire(e);},e.at*1000)));
}
const Q_T=[];let SHOWING=null;
function fire(e){if(e.live&&!e.live())return;Q_T.push(e);if(!SHOWING)nextToast();}
function nextToast(){
  const e=Q_T.shift();if(!e){SHOWING=null;$("toasts").innerHTML="";return;}SHOWING=e;
  if(e.mail){S.live.add(e.mail);hud();}
  ping(e.type);
  const icon=e.type==="call"?`<svg class="ring" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D14B4B" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>`:"";
  $("toasts").style.top=($("hud").offsetHeight+8)+"px";
  const rem=S.remind.has(e);
  const ch=(e.type==="call"?"اتصال وارد":e.type==="mail"?"بريد جديد":"رسالة واتساب")+(rem?"، تذكير: الرسالة ما زالت تنتظر ردّك":"");
  $("toasts").innerHTML=`<div class="toast ${e.type}" role="alert"><div class="h">${e.from?portrait(e.from,38):""}<div style="flex:1"><b>${e.from?C[e.from].n:e.sender}</b><div class="ch">${ch}</div></div>${icon}</div>
   <div class="tx">${e.text}</div><div class="acts">${(e.acts||[]).map((a,i)=>`<button data-i="${i}">${a.t}</button>`).join("")}<button class="later" data-i="x">${e.acts?(rem||!e.ignore?"تجاهل":"لاحقاً"):"حسناً"}</button></div></div>`;
  $("toasts").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(b.dataset.i==="x"&&e.dismiss==null){if(e.acts&&e.ignore)later(e,true);}
    else{const a=e.acts[b.dataset.i==="x"?e.dismiss:+b.dataset.i];const fx=typeof a.fx==="function"?a.fx():a.fx;const r=apply(fx);hud(r.d);if(fx.carry)S.carry+=fx.carry;
      S.log.push({t:"مقاطعة: "+(e.from?C[e.from].n:e.sender),c:a.short,tags:QK.filter(k=>(fx.prof||{})[k]>0)});
      if(a.after){SHOWING={};$("toasts").innerHTML=`<div class="toast ${e.type}"><div class="tx">${a.after}</div></div>`;TIMERS.push(setTimeout(nextToast,3200));return;}}
    nextToast();});
  if(!e.acts)TIMERS.push(setTimeout(()=>{if(SHOWING===e)nextToast();},9000));
}
function later(e,timer){
  if(S.remind.has(e)){S.pending.push(e);return;}
  S.remind.add(e);S.snz.push(e);
  if(timer)TIMERS.push(setTimeout(()=>{if(S.snz.includes(e)){S.snz=S.snz.filter(x=>x!==e);fire(e);}},20000));
}
function resolvePending(){
  if(SHOWING&&SHOWING.acts&&SHOWING.ignore)later(SHOWING,false);
  Q_T.forEach(e=>{if(e.acts&&e.ignore&&S.remind.has(e)&&!S.snz.includes(e))S.snz.push(e);});
  const keep=[];S.snz.forEach(e=>{if(e.urgent||S.step>=8)S.pending.push(e);else keep.push(e);});S.snz=keep;
  Q_T.concat(UNFIRED).forEach(e=>{if(e.mail)S.live.add(e.mail);});UNFIRED=[];
  SHOWING=null;
  S.pending.forEach(e=>{const fx=e.ignore;apply(fx);S.missed.push(e.note);S.log.push({t:"تجاهلت: "+(e.from?C[e.from].n:e.sender),c:"لم تردّ",tags:[]});});
  S.pending=[];
}
function showMissed(){
  if(!S.missed.length)return;
  const box=document.createElement("div");box.className="missed";box.innerHTML=`<b>ما فاتك</b>${S.missed.map(x=>`<div>${x}</div>`).join("")}`;
  const v=$("v-scene");v.insertBefore(box,v.firstChild);S.missed=[];
}
function startWait(w){
  let left=w.secs;const cd=$("cd");cd.hidden=false;cd.style.display="inline-flex";$("clock").style.display="none";cd.style.background="#F0B04A";cd.style.color="#0E2A2F";$("cdt").textContent=C[w.who].n+" ينتظر جوابك";
  const bar=()=>{$("tm")&&($("tm").firstElementChild.style.width=(left/w.secs*100)+"%");$("cdn").textContent=AR(Math.floor(left/60)+":"+String(left%60).padStart(2,"0"));if(left<=15){cd.style.background="#B03434";cd.style.color="#fff";}};bar();
  WAIT=setInterval(()=>{left--;bar();if(left<=0){stopWait(true);$("tm")&&$("tm").classList.add("late");
    const r=apply({rel:{[w.who]:-5}});S.log.push({t:"تأخرتَ في الرد على "+C[w.who].n,c:"انتهى وقت الانتظار",tags:[]});if($("tml"))$("tml").textContent="تأخرتَ في الرد";fire({type:"wa",from:w.who,text:w.text+AR(" (ثقة "+C[w.who].n+" −٥)")});}},1000);
}
function stopWait(late){if(WAIT){clearInterval(WAIT);WAIT=null;}const cd=$("cd"),off=()=>{cd.hidden=true;cd.style.display="none";$("clock").style.display="";};if(late){$("cdt").textContent="تأخرتَ في الرد";$("cdn").textContent="";setTimeout(()=>{if(!WAIT)off();},4000);}else off();}

/* ---------- sound ---------- */
let AC=null,MUTED=false;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
function tone(f,t0,d,v=.07){const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+t0);g.gain.linearRampToValueAtTime(v,AC.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t0+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.05);}
function ping(type){if(MUTED||!AC)return;try{
  if(type==="call"){[0,.9,1.8].forEach(t=>{tone(740,t,.28);tone(880,t+.3,.28);});if(navigator.vibrate)navigator.vibrate([200,150,200]);}
  else if(type==="mail"){tone(587,0,.22);}
  else{tone(880,0,.14);tone(1175,.13,.2);}
}catch(e){}}
$("mute").onclick=()=>{MUTED=!MUTED;$("mwave").style.display=MUTED?"none":"";$("mute").style.opacity=MUTED?.4:.8;};

/* ---------- corridor pulse ---------- */
function pulse(){
  const lowRel=Object.keys(C).filter(k=>k!=="sultan").sort((a,b)=>S.rel[a]-S.rel[b])[0];
  const lowInd=[...QK].sort((a,b)=>S.ind[a]-S.ind[b])[0];
  if(S.rel[lowRel]<40){return {khalid:"أحد المفتشين: «الأستاذ خالد يقول إن رأينا لا يهم أحداً في الطابق الثالث.»",reem:"موظفة في الخدمات الرقمية: «ريم تسأل لماذا نتعب إن كان كل شيء سيُؤجَّل.»",faisal:"موظف على الكاونتر: «فيصل لم يعد يمزح معنا كما كان.»",maha:"مها لزميلتها: «أرسل له ولا يرد.»",noura:"موظف في المالية: «إدارة التراخيص؟ الأستاذة نورة طلبت مراجعة كل أوراقهم.»"}[lowRel];}
  return {col:"في غرفة الاستراحة: «المدير الجديد لا نراه إلا في الاجتماعات.»",cre:"موظف في الخدمات الرقمية: «نسمع عن التحول أكثر مما نراه.»",cmp:"متعامل عند الكاونتر: «هذه ثالث مرة أراجعكم من أجل المعاملة نفسها.»",ctl:"موظف في التدقيق: «ملفات التراخيص ما زالت تصلنا ناقصة.»"}[lowInd];
}

/* ---------- self-prediction ---------- */
function predict(){
  S.day=30;hud();const sel={top:null,low:null};
  const row=(key,label)=>`<h3 style="margin-top:14px">${label}</h3><div class="quads">${QK.map(k=>`<button class="quad pq" data-g="${key}" data-k="${k}" style="background:${Q[k].c};border:3px solid transparent;text-align:right;cursor:pointer"><b>${Q[k].n}</b><span>${Q[k].roles}</span></button>`).join("")}</div>`;
  $("v-scene").innerHTML=`<div class="card"><h2>قبل أن ترى تقريرك</h2><p>انتهت أيامك الثلاثون الأولى. قبل أن تظهر بوصلتك، قدّر أنت كيف قُدت.</p>
   ${row("top","أي قطب تظن أنك استخدمته أكثر من غيره؟")}${row("low","وأي قطب استخدمته أقل من غيره؟")}
   <button class="btn" id="nx" disabled style="margin-top:8px">اعرض تقرير الفصل الأول</button></div>`;
  document.querySelectorAll(".pq").forEach(b=>b.onclick=()=>{sel[b.dataset.g]=b.dataset.k;
    document.querySelectorAll(`.pq[data-g=${b.dataset.g}]`).forEach(x=>{x.style.borderColor=x===b?"var(--ink)":"transparent";x.style.opacity=x===b?1:.55;});
    $("nx").disabled=!(sel.top&&sel.low&&sel.top!==sel.low);});
  $("nx").onclick=()=>{S.pred=sel;go();};
}

/* ---------- automatic saving ---------- */
let PLAYER={name:"",cohort:""};
function saveRun(r){
  const st=$("savest");if(S.saved){st.textContent="حُفظت نتيجتك وأُرسلت إلى المدرّب.";return;}
  st.textContent="يجري حفظ نتيجتك...";
  let n=1;try{n=+localStorage.getItem("sim90-n-"+PLAYER.name)||1;}catch(e){}
  const pct=k=>Math.round(r.sh[k]*100)+"%";
  const EN={col:"Collaborate",cre:"Create",cmp:"Compete",ctl:"Control"};
  const body={_subject:"Simulation result: "+(PLAYER.name||"Unnamed")+(PLAYER.cohort?" ("+PLAYER.cohort+")":""),_template:"table",_captcha:"false",
    Name:PLAYER.name||"(none)",Cohort:PLAYER.cohort||"(none)",Attempt:n,Minutes:Math.round((Date.now()-S.t0)/60000),
    "Range score":r.rs,"Strongest / weakest":EN[r.top]+" / "+EN[r.low],
    Compass:QK.map(k=>EN[k]+" "+pct(k)).join(", "),
    "Self-prediction":S.pred?EN[S.pred.top]+" strongest, "+EN[S.pred.low]+" weakest":"(none)",
    Indicators:QK.map(k=>EN[k]+" outcome "+S.ind[k]).join(", "),
    Relationships:Object.keys(C).map(k=>k+" "+S.rel[k]).join(", "),
    "One-to-ones (0-3)":Object.keys(C).map(k=>k+" "+S.know[k]).join(", "),
    Decisions:S.log.map((l,i)=>(i+1)+". "+l.t+(l.c?": "+l.c:"")+(l.why?" [سبب: "+l.why+"]":"")).join("\n"),
    "Khalid conversation":S.chat?S.chat.hist.map(m=>(m.r==="k"?"خالد: ":"المشارك: ")+m.t).join("\n"):"",
    Sent:new Date().toISOString(),
    "Khalid trust":S.chat?S.chat.start+" -> "+S.chat.trust+" | roles: "+[...new Set(S.chat.roles)].join(", "):"",
    Data:JSON.stringify({v:3,flags:S.flags,know:S.know,name:PLAYER.name,cohort:PLAYER.cohort,n,rs:r.rs,sh:r.sh,ind:S.ind,rel:S.rel,pred:S.pred,alloc:S.alloc,log:S.log.map(l=>[l.t,l.c||"",l.why||""])})};
  const ctrl=window.AbortController?new AbortController():null;const tm=setTimeout(()=>ctrl&&ctrl.abort(),10000);
  fetch("https://formsubmit.co/ajax/hisham@hishamelsaied.com",{method:"POST",signal:ctrl?ctrl.signal:undefined,headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)})
   .then(x=>x.json().catch(()=>({})).then(d=>x.ok&&String(d.success)!=="false")).catch(()=>false)
   .then(ok=>{clearTimeout(tm);if(!$("savest"))return;
     if(ok){S.saved=true;$("savest").textContent="حُفظت نتيجتك وأُرسلت إلى المدرّب.";}
     else{$("savest").innerHTML=`تعذّر حفظ النتيجة. <button class="btn line" id="rs" style="padding:4px 14px">أعد المحاولة</button>`;$("rs").onclick=()=>saveRun(r);}});
}

/* ---------- boot ---------- */
const FAC=location.hash==="#facilitator";if(FAC)$("trtab").hidden=false;
const CODE="WAHA";
function gate(){
  let ok=false;try{ok=sessionStorage.getItem("sim90")==="1";}catch(e){}
  try{PLAYER=JSON.parse(sessionStorage.getItem("sim90-p"))||PLAYER;}catch(e){}
  if(ok&&PLAYER.name){intro();return;}
  if(ok){who();return;}
  $("v-scene").innerHTML=`<div class="card gate"><h2>محاكاة القيادة</h2><p class="muted">نسخة تجريبية خاصة. أدخل رمز الدخول.</p>
   <form id="gf"><input id="gc" autocomplete="off" aria-label="رمز الدخول" dir="ltr"><button class="btn" style="width:100%">دخول</button></form><p id="ge" class="muted"></p></div>`;
  $("gf").onsubmit=e=>{e.preventDefault();if($("gc").value.trim().toUpperCase()===CODE){try{sessionStorage.setItem("sim90","1")}catch(_){}who();}else{$("ge").textContent="الرمز غير صحيح.";}};
}
function who(){
  $("v-scene").innerHTML=`<div class="card gate"><h2>قبل أن تبدأ</h2><p class="muted">اكتب اسمك كما تريد أن يظهر لمدرّب البرنامج.</p>
   <form id="wf"><input id="wn" placeholder="الاسم" aria-label="الاسم" required maxlength="60" style="letter-spacing:0;font-size:17px">
   <input id="wc" placeholder="رمز المجموعة (إن وُجد)" aria-label="رمز المجموعة" maxlength="30" style="letter-spacing:0;font-size:17px;margin-top:0">
   <button class="btn" style="width:100%">متابعة</button></form></div>`;
  $("wf").onsubmit=e=>{e.preventDefault();PLAYER={name:$("wn").value.trim(),cohort:$("wc").value.trim()};if(!PLAYER.name)return;try{sessionStorage.setItem("sim90-p",JSON.stringify(PLAYER))}catch(_){}intro();};
}
gate();
(async()=>{try{if(window.claude&&claude.use){const s=await claude.use("sample");if(s)SAMPLE=s;}}catch(e){}})();
