  <section class="dark hero" style="padding-bottom:72px">
    <div class="wrap stack">

      <h1>كوتشينج أم إرشاد أم تدريب؟</h1>
      <p class="lead">ستة أسئلة في دقيقتين تقريباً. أجب عن نفسك، أو عن أحد القادة في فريقك.</p>
    </div>
  </section>
  <section class="light">
    <div class="wrap rs-tool">
      <form id="picker" class="pk" novalidate>
        <fieldset class="pk-q"><legend><span>١</span>ما الوصف الأقرب للفجوة؟</legend>
          <label class="pk-opt"><input type="radio" name="q0" value="t"><span>لا يملك بعد مهارة أو معرفة يحتاجها العمل.</span></label>
          <label class="pk-opt"><input type="radio" name="q0" value="m"><span>جديد على هذا المستوى، أو هذا القطاع، أو هذه المؤسسة.</span></label>
          <label class="pk-opt"><input type="radio" name="q0" value="c"><span>يعرف ما يجب فعله، لكنه لا يفعله.</span></label>
        </fieldset>
        <fieldset class="pk-q"><legend><span>٢</span>هل لدى آخرين في الفريق الفجوة نفسها؟</legend>
          <label class="pk-opt"><input type="radio" name="q1" value="t"><span>نعم، كثيرون يحتاجون الشيء نفسه.</span></label>
          <label class="pk-opt"><input type="radio" name="q1" value="m"><span>قلة ممن هم في المرحلة المهنية نفسها.</span></label>
          <label class="pk-opt"><input type="radio" name="q1" value="c"><span>لا، الأمر خاص بهذا الشخص وموقفه.</span></label>
        </fieldset>
        <fieldset class="pk-q"><legend><span>٣</span>ما الذي يساعد أكثر الآن؟</legend>
          <label class="pk-opt"><input type="radio" name="q2" value="t"><span>شخص يعلّمه طريقة أو أداة.</span></label>
          <label class="pk-opt"><input type="radio" name="q2" value="m"><span>شخص شغل هذا الدور من قبل يشرح كيف تسير الأمور.</span></label>
          <label class="pk-opt"><input type="radio" name="q2" value="c"><span>شخص يساعده على التفكير في الأمر واتخاذ القرار.</span></label>
        </fieldset>
        <fieldset class="pk-q"><legend><span>٤</span>بماذا تتعلق المسألة في الغالب؟</legend>
          <label class="pk-opt"><input type="radio" name="q3" value="t"><span>معرفة فنية أو تخصصية.</span></label>
          <label class="pk-opt"><input type="radio" name="q3" value="m"><span>فهم الثقافة والسياسة الداخلية وكيف تسير الأمور هنا.</span></label>
          <label class="pk-opt"><input type="radio" name="q3" value="c"><span>الثقة، أو العلاقات، أو التقدير، أو قرار ما.</span></label>
        </fieldset>
        <fieldset class="pk-q"><legend><span>٥</span>أين توجد الإجابة؟</legend>
          <label class="pk-opt"><input type="radio" name="q4" value="t"><span>يستطيع خبير أن يقدّمها.</span></label>
          <label class="pk-opt"><input type="radio" name="q4" value="m"><span>يعرفها مسبقاً شخص أقدم منه.</span></label>
          <label class="pk-opt"><input type="radio" name="q4" value="c"><span>لا يجدها إلا الشخص نفسه، لأنها تعتمد عليه.</span></label>
        </fieldset>
        <fieldset class="pk-q"><legend><span>٦</span>كم من الوقت متاح؟</legend>
          <label class="pk-opt"><input type="radio" name="q5" value="t"><span>يحتاجه لمهمة خلال الأسابيع القليلة القادمة.</span></label>
          <label class="pk-opt"><input type="radio" name="q5" value="m"><span>سيتكوّن خلال الأشهر الأولى في الدور.</span></label>
          <label class="pk-opt"><input type="radio" name="q5" value="c"><span>يتعلق بتغيير دائم في طريقة قيادته.</span></label>
        </fieldset>
        <div><button class="btn x-dark" type="submit">اعرض النتيجة</button></div>
      </form>
