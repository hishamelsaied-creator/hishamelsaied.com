name: Video dates
on:
  push:
    paths: [".github/workflows/video-dates.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          pip install -q yt-dlp >/dev/null 2>&1
          : > video-dates.txt
          for id in vZPfe2Lh18I 3u2RgcnxhOU S2xIsEFlZDY ojHBFPRFzeU z_S9lsvSaCY; do
            a=$(yt-dlp --skip-download --print "%(upload_date)s|%(duration)s|%(title)s" "https://www.youtube.com/watch?v=$id" 2>&1 | tail -1)
            b=$(curl -s -m 30 -H "Content-Type: application/json" -d "{\"videoId\":\"$id\",\"context\":{\"client\":{\"clientName\":\"WEB\",\"clientVersion\":\"2.20241101.00.00\",\"hl\":\"en\"}}}" "https://www.youtube.com/youtubei/v1/player?prettyPrint=false" | grep -o '"uploadDate":"[^"]*"\|"lengthSeconds":"[0-9]*"' | head -2 | tr '\n' ' ')
            c=$(curl -s -m 30 "https://inv.nadeko.net/api/v1/videos/$id?fields=published,lengthSeconds,title" | head -c 300)
            echo "$id | ytdlp: $a | innertube: $b | inv: $c" >> video-dates.txt
          done
          cat video-dates.txt
          git config user.name "Hisham Elsaied"; git config user.email "hisham@hishamelsaied.com"
          git add video-dates.txt && git commit -m "Video dates" && git push
