name: IndexNow
on:
  push:
    branches: [main]
    paths: ["sitemap.xml", "**/index.html", "llms.txt"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell Bing and other IndexNow engines about every page
        shell: bash {0}
        run: |
          URLS=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]+['https://hishamelsaied.com/llms.txt']+['https://hishamelsaied.com/'+p for p in 'about.php blog.php contact.php contactform2.php gallery.php individual-solutions.php solutions.php solutions-for-teams.php platform-presence.php testimonials.php privacy-policy.php blog blog-guide-to-find-the-right-coach-60 blog-benefits-of-coaching-65 blog-self-awareness-for-leaders-62 blog-self-confidence-64 blog-transitions-through-coaching-66'.split()]))")
          curl -sS -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"hishamelsaied.com\",\"key\":\"877572828004e0cec02248ef47d2038d\",\"keyLocation\":\"https://hishamelsaied.com/877572828004e0cec02248ef47d2038d.txt\",\"urlList\":$URLS}" -w "\nHTTP %{http_code}\n"
