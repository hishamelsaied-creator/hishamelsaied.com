name: IndexNow
on:
  push:
    branches: [main]
    paths: ["sitemap.xml", "**/index.html", "llms.txt"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell Bing and other IndexNow engines about every page
        shell: bash {0}
        run: |
          URLS=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]+['https://hishamelsaied.com/llms.txt']+['https://hishamelsaied.com/'+p for p in 'about.php blog.php contact.php contactform2.php gallery.php individual-solutions.php solutions.php solutions-for-teams.php platform-presence.php testimonials.php privacy-policy.php blog blog-guide-to-find-the-right-coach-60 blog-benefits-of-coaching-65 blog-self-awareness-for-leaders-62 blog-self-confidence-64 blog-transitions-through-coaching-66'.split()]))")
          BODY="{\"host\":\"hishamelsaied.com\",\"key\":\"877572828004e0cec02248ef47d2038d\",\"keyLocation\":\"https://hishamelsaied.com/877572828004e0cec02248ef47d2038d.txt\",\"urlList\":$URLS}"
          curl -sS -o /dev/null -w "key file HTTP %{http_code}\n" https://hishamelsaied.com/877572828004e0cec02248ef47d2038d.txt
          OK=0
          for EP in https://api.indexnow.org/indexnow https://www.bing.com/indexnow https://yandex.com/indexnow; do
            CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST "$EP" -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
            echo "$EP HTTP $CODE $(head -c 300 /tmp/resp.txt)"
            case "$CODE" in 200|202) OK=1;; esac
          done
          # Bing has been refusing the first key; try a second key file without keyLocation
          B2="{\"host\":\"hishamelsaied.com\",\"key\":\"ae8a367b75970c835c100662b37152ca\",\"urlList\":$URLS}"
          CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST https://www.bing.com/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$B2")
          echo "bing second key HTTP $CODE $(head -c 300 /tmp/resp.txt)"
          case "$CODE" in 200|202) OK=1;; esac
          # Fail loudly if no engine accepted the submission, instead of reporting success
          [ "$OK" = 1 ] || exit 1
