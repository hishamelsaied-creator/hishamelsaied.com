name: Site check
on:
  push:
    paths: [".github/workflows/https.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          curl -sS -m 30 -X POST https://formsubmit.co/ajax/hisham@hishamelsaied.com -H "Content-Type: application/json" -H "Accept: application/json" -H "Referer: http://hishamelsaied.com/hr-self-check/" -H "Origin: http://hishamelsaied.com" -d '{"name":"Hisham Elsaied","email":"hisham@hishamelsaied.com","Note":"Test entry to activate the self-check form","_captcha":"false"}'
